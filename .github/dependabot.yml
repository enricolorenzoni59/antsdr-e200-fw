version: 2

updates:
  # The workflows pin actions by commit SHA. Dependabot proposes newer pins;
  # the host checks still gate every PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"

  # requirements-test.txt is the only Python dependency manifest in the repo.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "test"
    labels:
      - "dependencies"
    groups:
      python-tests:
        patterns:
          - "*"

# Dependabot cannot track the kernel, Buildroot, libiio, libad9361, vendor
# BSP or the Arm toolchain: they are pinned by lock files and Buildroot
# recipes, not by a supported package manifest. The scheduled workflow in
# .github/workflows/upstream-watch.yml covers those.
